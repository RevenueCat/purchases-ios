  focused-storekit:
    parameters:
      xcode_version:
        type: string
      device:
        type: string
      legacy_xcode:
        type: boolean
        default: false
    executor:
      name: macos-executor
      xcode_version: << parameters.xcode_version >>
    steps:
      - checkout
      - install-dependencies:
          install_xcbeautify: false
          install_mint: true
      - when:
          condition: << parameters.legacy_xcode >>
          steps:
            - install-xcodes-for-xcode14
            - install-xcbeautify-for-xcode14
      - unless:
          condition: << parameters.legacy_xcode >>
          steps:
            - install-xcbeautify-for-xcode15
      - update-spm-installation-commit
      - run:
          name: Run affected StoreKit classes
          command: bundle exec fastlane test_ios
          no_output_timeout: 10m
          environment:
            SCAN_DEVICE: << parameters.device >>
            SCAN_ONLY_TESTING: StoreKitUnitTests/StoreKit2TransactionFetcherTests,StoreKitUnitTests/StoreKit2TransactionListenerCustomStreamTests,StoreKitUnitTests/StoreKit2ObserverModePurchaseDetectorTests
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

  focused-callbacks:
    parameters:
      xcode_version:
        type: string
      device:
        type: string
    executor:
      name: macos-executor
      xcode_version: << parameters.xcode_version >>
    steps:
      - checkout
      - install-dependencies:
          install_xcbeautify: false
      - update-spm-installation-commit
      - run:
          name: Run URL callback classes
          command: |
            set -o pipefail
            mkdir -p fastlane/test_output
            xcodebuild test -workspace . -scheme RevenueCatUI -testPlan CI-RevenueCatUI \
              -destination "platform=iOS Simulator,name=$DEVICE" \
              -only-testing:RevenueCatUITests/OnURLOpenedModifierTests \
              -only-testing:RevenueCatUITests/OnWebCheckoutOpenedModifierTests \
              -parallel-testing-enabled NO \
              -resultBundlePath fastlane/test_output/callbacks.xcresult \
              | bundle exec xcpretty --report junit --output fastlane/test_output/tests.xml
          no_output_timeout: 10m
          environment:
            DEVICE: << parameters.device >>
      - store_test_results:
          path: fastlane/test_output
      - store_artifacts:
          path: fastlane/test_output

workflows:
  focused-compatibility:
    jobs:
      - focused-storekit:
          name: focused-storekit-ios-15
          xcode_version: "14.3.1"
          device: iPhone 13 (15.5)
          legacy_xcode: true
          context: slack-secrets
      - focused-storekit:
          name: focused-storekit-ios-16
          xcode_version: "15.4.0"
          device: iPhone 14 (16.4)
          context: slack-secrets
      - focused-callbacks:
          name: focused-callbacks-ios-15
          xcode_version: "14.3.1"
          device: iPhone 13,OS=15.5
          context: slack-secrets
      - focused-callbacks:
          name: focused-callbacks-ios-16
          xcode_version: "15.4.0"
          device: iPhone 14,OS=16.4
          context: slack-secrets
      - focused-callbacks:
          name: focused-callbacks-ios-18
          xcode_version: "16.4"
          device: iPhone 16,OS=18.5
          context: slack-secrets
