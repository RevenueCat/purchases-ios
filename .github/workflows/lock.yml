# Configuration for Lock Threads: https://github.com/dessant/lock-threads

name: "Lock Threads"

on:
  schedule:
    - cron: "0 0 * * *" # runs at 00:00 UTC every day

permissions:
  issues: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          issue-inactive-days: "7"
          exclude-issue-created-before: "2021-03-01T00:00:00Z"
          exclude-issue-closed-before: "2026-11-02T00:00:00Z"
          exclude-any-issue-labels: "enhancement, do-not-lock"
          issue-comment: >
            This issue has been automatically locked due to no recent activity after it 
            was closed. Please open a new issue for related reports.
          issue-lock-reason: ""
          process-only: "issues"
