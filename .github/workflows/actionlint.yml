name: Lint GitHub Actions workflows
on: 
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions: {}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: revenuecat/sdk-github-workflows/.github/workflows/actionlint.yml@9bb6a6db67a9a941e10e690b61d0dc6f0020f470 # v10
