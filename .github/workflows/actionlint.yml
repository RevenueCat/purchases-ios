name: Lint GitHub Actions workflows
on: 
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions: {}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: revenuecat/sdk-github-workflows/.github/workflows/actionlint.yml@099dd3ed02c87b713fea5f8162e33f73377312eb # alvarobrey/shared-actionlint
