name: Lint GitHub Actions workflows
on: 
  push:
    branches: [main]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']

permissions: {}

jobs:
  actionlint:
    permissions:
      contents: read
    uses: revenuecat/sdk-github-workflows/.github/workflows/actionlint.yml@8a6e807d0a037db19f518f64100d42c70ce11aff # alvarobrey/shared-actionlint
