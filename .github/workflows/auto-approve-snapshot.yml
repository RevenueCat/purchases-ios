name: Auto-approve snapshot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  approve:
    # Approves RCGitBot's `Prepare next version` PRs so they satisfy the
    # required review. Auto-merge is armed by the bot at creation, and
    # RCGitBot can't approve its own PR.
    if: |
      startsWith(github.event.pull_request.head.ref, 'bump/') &&
      github.event.pull_request.user.login == 'RCGitBot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
