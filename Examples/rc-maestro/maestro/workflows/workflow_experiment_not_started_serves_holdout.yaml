# Same shape as workflow_experiment_assigns_variant, against a workflow whose
# experiment was never started. Nobody is enrolled, so the backend collapses the
# experiment step to its fallback and everyone follows variant A.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_experiment_not_started_serves_holdout.yaml

appId: com.revenuecat.maestro.ios
name: An experiment that was never started serves the holdout
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow
        workflow_offering_identifier: "experiments unstarted"
        app_user_id: "maestro-experiment-user-1"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000
- tapOn:
    text: "Present Paywall"

# Screen 1
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn:
    text: "Continue"

# Screen 2, whose exit points at the experiment step
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn:
    text: "Continue"

# Asserting both ways keeps this honest: a dead end fails the first, and an
# accidental enrollment fails the second.
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better"
    timeout: 15000
- assertNotVisible: "Get started with our Standard plan"
- takeScreenshot: "workflow_experiment_not_started_serves_holdout - holdout"
