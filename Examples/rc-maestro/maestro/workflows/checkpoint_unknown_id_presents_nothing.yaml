# Hits a checkpoint id that has no rules. Nothing is presented and the callback reports nil, so the
# app can continue.
#
# The first hit of an unknown id creates it in the dashboard as a checkpoint without rules, so after
# that this covers both an unknown id and a checkpoint without rules. The public API cannot tell
# them apart; CheckpointWorkflowResolverTests covers the reasons.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/checkpoint_unknown_id_presents_nothing.yaml

appId: com.revenuecat.maestro.ios
name: An unknown checkpoint presents nothing
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- runFlow: ../utils/checkpoint_launch.yaml
- runFlow:
    file: ../utils/checkpoint_hit.yaml
    env:
      CHECKPOINT_ID: maestro_not_configured
      ATTEMPT: 1
      EXPECTED_OFFERING: none
