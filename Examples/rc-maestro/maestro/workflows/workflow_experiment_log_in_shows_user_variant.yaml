# A new anonymous user sees whichever variant their random id resolves to. Logging in as the
# pinned user on the other variant must switch the workflow to that user's variant.
# maestro-experiment-user-1 resolves to variant A and maestro-experiment-user-2 to variant B.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_experiment_log_in_shows_user_variant.yaml

appId: com.revenuecat.maestro.ios
name: Logging in shows the logged in user's experiment variant
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow
        workflow_offering_identifier: '"[facu] branching1"'
        log_in_app_user_ids: '"maestro-experiment-user-1,maestro-experiment-user-2"'
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000
- tapOn: "Present Paywall"
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: "Continue 1/3"
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: "Continue 2/3"
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better|Unlock the universe with our Premium plan"
    timeout: 15000
- runFlow:
    when:
      visible: "People Who Meditate Daily Sleep 40% Better"
    commands:
      - evalScript: ${output.anonymousVariant = 'A'}
- runFlow:
    when:
      visible: "Unlock the universe with our Premium plan"
    commands:
      - evalScript: ${output.anonymousVariant = 'B'}
- takeScreenshot: "workflow_experiment_log_in_shows_user_variant - anonymous"
- swipe:
    start: "50%,20%"
    end: "50%,95%"

# Log in as the user on the other variant.
- runFlow:
    when:
      true: ${output.anonymousVariant == 'A'}
    commands:
      - tapOn: "Log In as maestro-experiment-user-2"
      - extendedWaitUntil:
          visible: "Logged in as maestro-experiment-user-2"
          timeout: 15000
- runFlow:
    when:
      true: ${output.anonymousVariant == 'B'}
    commands:
      - tapOn: "Log In as maestro-experiment-user-1"
      - extendedWaitUntil:
          visible: "Logged in as maestro-experiment-user-1"
          timeout: 15000

- tapOn: "Present Paywall"
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: "Continue 1/3"
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: "Continue 2/3"
- runFlow:
    when:
      true: ${output.anonymousVariant == 'A'}
    commands:
      - extendedWaitUntil:
          visible: "Unlock the universe with our Premium plan"
          timeout: 15000
      - assertNotVisible: "People Who Meditate Daily Sleep 40% Better"
- runFlow:
    when:
      true: ${output.anonymousVariant == 'B'}
    commands:
      - extendedWaitUntil:
          visible: "People Who Meditate Daily Sleep 40% Better"
          timeout: 15000
      - assertNotVisible: "Unlock the universe with our Premium plan"
- takeScreenshot: "workflow_experiment_log_in_shows_user_variant - logged in"
