# Regression test for presenting a paywall with a developer-modified `Offering` instance.
#
# The app loads the current offering, rebuilds it without the `$rc_monthly` package, and passes that
# copy to `PaywallView(offering:)`. The copy has no paywall attached, so the SDK resolves it through
# the workflows path. That path used to re-fetch the offering by identifier and render the SDK's own
# copy, so the monthly card still appeared. The SDK must render the passed instance instead.
#
# Rendered selection isn't assertable, so the flow also taps the purchase button and reads back which
# package the SDK was about to buy. `onPurchaseInitiated` declines, so no StoreKit sheet opens.
#
# Expected: only the annual card is on screen and the purchase targets `$rc_annual`.
# Before the fix the monthly card rendered and the purchase targeted `$rc_monthly`.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store \
#     Examples/rc-maestro/maestro/workflows/developer_provided_offering_filters_packages.yaml

appId: com.revenuecat.maestro.ios
name: Developer-provided offering renders only its own packages
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_developer_provided_offering
- assertVisible: "entitlement (pro): nil"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000

# The copy handed to the paywall no longer contains the monthly package.
- assertVisible: "packages: \\$rc_annual"
- tapOn:
    text: "Present Paywall"

# Only the annual card renders.
- extendedWaitUntil:
    visible: "Yearly"
    timeout: 15000
- assertNotVisible: "Monthly"
- takeScreenshot: "developer_provided_offering_filters_packages - paywall"

- tapOn:
    text: "Continue"

# The purchase targets the only package left in the passed offering.
- extendedWaitUntil:
    visible: "selected package: \\$rc_annual"
    timeout: 15000
- assertNotVisible: "selected package: \\$rc_monthly"
- takeScreenshot: "developer_provided_offering_filters_packages - selected package"
