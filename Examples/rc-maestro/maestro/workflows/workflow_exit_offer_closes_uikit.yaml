# Closing the exit offer must dismiss it, when the paywall was presented through the UIKit
# `PaywallViewController` and the host supplied a `dismissRequestedHandler`.
#
# The SDK presents the exit offer in a controller the host never created. It used to forward that
# controller's dismissal to the host handler, so a host that dismisses its own captured controller
# (see `OpenWorkflowUIKit`, which is written that way on purpose) left the exit offer stranded: the
# close button highlighted on every tap and nothing happened.
#
# Navigation mirrors workflow_exit_offer_on_last_page.yaml, so it reuses the same app, offering and
# steps that flow already exercises. Leaving the last page goes through the labeled button the
# dashboard puts there.
#
# The exit offer's close button is authored on the paywall (Header -> Close button), so it is an
# unlabeled icon with no accessibility text and can only be tapped by coordinate. It sits top-trailing;
# measured bounds on iPhone 17 Pro were [332,62][402,108], hence 91%,10%. If this ever misses, the tap
# still "succeeds" and only the assertions below fail, so check the failure screenshot before assuming
# the SDK regressed.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_exit_offer_closes_uikit.yaml

appId: com.revenuecat.maestro.ios
name: Workflow exit offer closes when presented from UIKit
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow_uikit
- extendedWaitUntil: { visible: "Present Paywall", timeout: 15000 }
- tapOn: { text: "Present Paywall" }
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn: { text: "Continue 1/3" }
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn: { text: "Continue 2/3" }
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better"
    timeout: 15000

# Close the last page -> the exit offer paywall is presented.
- tapOn: { text: "Close Paywall" }
- extendedWaitUntil:
    visible: "Unlock full access"
    timeout: 15000
- takeScreenshot: "workflow_exit_offer_closes_uikit_presented"

# Close the exit offer -> it goes away and we are back on the launcher, not stuck on the paywall.
- tapOn: { point: "91%,10%" }
- waitForAnimationToEnd: { timeout: 8000 }
- assertNotVisible: "Unlock full access"
- assertVisible: "Workflow paywall (UIKit)"
- takeScreenshot: "workflow_exit_offer_closes_uikit_dismissed"
