# The /v1/config kill switch tripping MID-SESSION must degrade a workflow offering to the classic
# single-page paywall (the workflow's last screen), the same way a cold launch does in
# workflow_config_fallback.yaml. It used to render the SDK's generic default paywall instead, because an
# offering the app already held had its paywall components pruned with nothing left to render. The degraded
# paywall must also still complete a purchase.
#
# The kill switch is armed and the refresh driven through in-app controls rather than a relaunch or a deep
# link: a relaunch would reset the session this scenario needs to keep, and opening a URL makes iOS put a
# confirmation dialog on screen that then blocks every following flow in this directory.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_config_killswitch_mid_session.yaml

appId: com.revenuecat.maestro.ios
name: Workflow offering falls back to the classic paywall when the config kill switch trips mid-session
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow
- assertVisible: "entitlement (pro): nil"
# Wait for offerings to load before the button appears.
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 20000
- tapOn:
    text: "Present Paywall"

# All three screens of the workflow render while config is healthy. Each screen is identified by the counter
# on its Continue button; the third one starts the purchase, so this pass only asserts it.
- extendedWaitUntil:
    visible: "Continue 1/3"
    timeout: 15000
- takeScreenshot: "workflow_config_killswitch_mid_session - screen 1"
- tapOn:
    text: "Continue 1/3"
- extendedWaitUntil:
    visible: "Continue 2/3"
    timeout: 15000
- tapOn:
    text: "Continue 2/3"
- extendedWaitUntil:
    visible: "Continue 3/3"
    timeout: 15000
- takeScreenshot: "workflow_config_killswitch_mid_session - screen 3"

# Back to the launcher, through the labeled close button the dashboard puts on the last screen (the other
# screens' close controls are unlabeled icons, which flows can only tap by coordinate).
- tapOn:
    text: "Close Paywall"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000

# Arm the kill switch. Nothing requests config between here and the refresh below, so that refresh is
# guaranteed to be the one that trips it.
- tapOn:
    text: "Force Config Killswitch"

# Drives the config request that returns the kill switch. The label only appears once the kill switch has
# landed, so waiting on it removes the need for a sleep here. Note that the offering this screen holds is
# deliberately not reloaded: presenting the one captured before the kill switch is the scenario under test.
- tapOn:
    text: "Sync Attributes And Offerings"
- extendedWaitUntil:
    visible: "config killswitch: on"
    timeout: 30000

- tapOn:
    text: "Present Paywall"

# Only the workflow's last screen is left, on its own, as the classic single-page paywall...
- extendedWaitUntil:
    visible: "Continue 3/3"
    timeout: 15000
# ...so the multipage workflow is gone, and so is the SDK's generic default paywall ("No Paywall configured"
# is its DEBUG warning), which is what this scenario used to render.
- assertNotVisible: "Continue 1/3"
- assertNotVisible: "No Paywall configured"
- takeScreenshot: "workflow_config_killswitch_mid_session - classic paywall"

# The degraded paywall must still be able to sell: the kill switch only takes out /v1/config, and the
# packages this screen renders come from /v1/offerings.
- tapOn:
    text: "Continue 3/3"
- runFlow:
    file: ../utils/confirm_purchase.yaml
    env:
      SCREENSHOT_PREFIX: workflow_config_killswitch_mid_session
- extendedWaitUntil:
    visible: "entitlement (pro): active"
    timeout: 15000
- takeScreenshot: "workflow_config_killswitch_mid_session - unlocked entitlement"
