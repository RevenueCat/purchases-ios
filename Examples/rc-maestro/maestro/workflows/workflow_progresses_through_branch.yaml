# Opens the workflow whose offering is `with-branch`:
#   Welcome Screen 1 -> Branch 1 -> Testimonials 1 -> Paywall screen 1
# Branch 1 can also route to Testimonials 3, which has no outgoing edge to the paywall. Reaching the
# "Limited time offer" paywall therefore proves the branch resolved and routed to Testimonials 1.
#
# TODO: confirm the user lands on Testimonials 1 by default. If it depends on the audience, set the
# matching launch argument (see workflow_initial_branch_routes_audience.yaml for `app_user_id`).
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_progresses_through_branch.yaml

appId: com.revenuecat.maestro.ios
name: A workflow progresses through its branch node
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow
        workflow_offering_identifier: "with-branch"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000
- tapOn:
    text: "Present Paywall"

# Welcome screen 1, before the branch node.
- extendedWaitUntil:
    visible: "See how NatureCat can change your life"
    timeout: 15000
- takeScreenshot: "workflow_progresses_through_branch - welcome screen 1"
- tapOn:
    text: "Continue"

# Branch 1 -> Testimonials 1.
- extendedWaitUntil:
    visible: "(?s).*Over 1 million.*"
    timeout: 15000
- assertNotVisible: "Cat whisperer in your pocket"
- takeScreenshot: "workflow_progresses_through_branch - testimonials 1"
- tapOn:
    text: "Continue"

# Final screen, reached through the branch.
- extendedWaitUntil:
    visible: "Limited time offer"
    timeout: 15000
- assertVisible: "Lowest price guaranteed"
- assertVisible: "25OFFSUMMER"
- assertVisible: "Claim limited time offer"
- takeScreenshot: "workflow_progresses_through_branch - limited time offer"
