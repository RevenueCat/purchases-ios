# `donottouch_sdk_entitlement`: an active entitlement goes to `no_paywall`, everyone else to
# `default`. A fresh user gets `default`; after a test store purchase grants `pro`, the same
# process gets `no_paywall` without a restart.
#
# Fixtures live in the Automated SDK Tests project (6627e5bc). Do not edit them.
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/checkpoint_entitlement.yaml

appId: com.revenuecat.maestro.ios
name: An active entitlement rule follows a purchase
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- runFlow: ../utils/checkpoint_launch.yaml
- assertVisible: "entitlement \\(pro\\): nil"
- runFlow:
    file: ../utils/checkpoint_hit.yaml
    env:
      CHECKPOINT_ID: donottouch_sdk_entitlement
      ATTEMPT: 1
      EXPECTED_OFFERING: default

- tapOn:
    id: purchase
- runFlow:
    file: ../utils/confirm_purchase.yaml
    env:
      SCREENSHOT_PREFIX: checkpoint_entitlement
- extendedWaitUntil:
    visible: "purchase: completed, active \\[pro\\]"
    timeout: 20000
- assertVisible: "entitlement \\(pro\\): active"

- runFlow:
    file: ../utils/checkpoint_hit.yaml
    env:
      CHECKPOINT_ID: donottouch_sdk_entitlement
      ATTEMPT: 2
      EXPECTED_OFFERING: no_paywall
