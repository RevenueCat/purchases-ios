# Opens a workflow whose third step is a started experiment and asserts the SDK
# lands on one of the variant paywalls. The experiment step has no screen of its
# own: the backend resolves enrollment and serves a pre-pruned blob, so the SDK
# should never see it.
#
# `app_user_id` is pinned because the backend resolves the combo from it, so the
# same id resolves the same variant on every run.
#
# Run locally against the test store:
#   maestro test -e MAESTRO_STORE=test_store Examples/rc-maestro/maestro/workflows/workflow_experiment_assigns_variant.yaml

appId: com.revenuecat.maestro.ios
name: A started experiment assigns a variant paywall
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
# Dismiss any leftover system alerts from previous test runs.
- pressKey: home
- launchApp:
    arguments:
        e2e_test_flow: open_workflow
        workflow_offering_identifier: "[facu] branching1"
        app_user_id: "maestro-experiment-user-1"
- extendedWaitUntil:
    visible: "Present Paywall"
    timeout: 15000
- tapOn:
    text: "Present Paywall"

# Screen 1
- extendedWaitUntil:
    visible: "Start Your Free Week And Reclaim 30+ Minutes Daily"
    timeout: 15000
- tapOn:
    text: "Continue 1/3"

# Screen 2, whose exit points at the experiment step
- extendedWaitUntil:
    visible: "Most People Feel Calmer After Just 3 Sessions"
    timeout: 15000
- tapOn:
    text: "Continue 2/3"

# Either variant is a valid outcome, so match on both titles. Asserting a
# variant-specific string is what makes this fail if the SDK dead-ends on the
# screenless experiment step, or falls back to the default paywall.
- extendedWaitUntil:
    visible: "People Who Meditate Daily Sleep 40% Better|Get started with our Standard plan"
    timeout: 15000

# Record which variant this user resolved to.
- runFlow:
    when:
      visible: "People Who Meditate Daily Sleep 40% Better"
    commands:
      - takeScreenshot: "workflow_experiment_assigns_variant - variant A (control)"
- runFlow:
    when:
      visible: "Get started with our Standard plan"
    commands:
      - takeScreenshot: "workflow_experiment_assigns_variant - variant B"
