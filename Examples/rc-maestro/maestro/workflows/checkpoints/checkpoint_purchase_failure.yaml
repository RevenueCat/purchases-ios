# A real injected Flow performs a purchase through an injected native purchase dependency. Its failure reaches the
# checkpoint's default error presenter while keeping the Flow open.

appId: com.revenuecat.maestro.ios
name: Injected purchase failure uses the default checkpoint error presenter and keeps the Flow open
env:
  MAESTRO_STORE: test_store

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_purchase_failure
      maestro_store: test_store
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 15000
- tapOn: "Hit checkpoint"

- extendedWaitUntil:
    visible: "Test Store purchase Flow"
    timeout: 20000
- tapOn: "Test purchase"

- extendedWaitUntil:
    visible: "Purchase failure simulated successfully in Test Store."
    timeout: 15000
- takeScreenshot: "checkpoint_purchase_failure - error"
- tapOn: "OK"

- assertVisible: "Test Store purchase Flow"
- swipe:
    start: "50%,10%"
    end: "50%,90%"
    duration: 600
- extendedWaitUntil:
    visible: "Callback: none (call #1)"
    timeout: 15000
