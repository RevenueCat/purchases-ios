# The checkpoint presents a real Flow. Its second screen is missing, so the localized action error appears while the
# first screen remains open.

appId: com.revenuecat.maestro.ios
name: Later Flow screen failure uses Spanish localized error copy and keeps the Flow open
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_second_screen_failure_spanish
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 15000
- tapOn:
    text: "Hit checkpoint"

- extendedWaitUntil:
    visible: "First screen loaded"
    timeout: 20000
- tapOn:
    text: "Continue"

- extendedWaitUntil:
    visible: "Algo salió mal. Inténtalo de nuevo."
    timeout: 15000
- takeScreenshot: "checkpoint_second_screen_failure_spanish - error"
- tapOn:
    text: "OK"

- assertVisible: "First screen loaded"
- swipe:
    start: "50%,10%"
    end: "50%,90%"
    duration: 600
- extendedWaitUntil:
    visible: "Callback: none (call #1)"
    timeout: 15000
