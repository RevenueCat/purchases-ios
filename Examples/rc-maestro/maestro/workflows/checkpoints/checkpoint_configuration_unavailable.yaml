# The native resolver reports unavailable configuration, matching an offline cold cache without network mocking.
# The SDK presents the error and suppresses the callback.

appId: com.revenuecat.maestro.ios
name: Checkpoint with unavailable configuration shows an error and does not invoke its callback
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_configuration_unavailable
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 15000
- tapOn:
    text: "Hit checkpoint"

- extendedWaitUntil:
    visible: "This content couldn't be loaded. Please try again later."
    timeout: 15000
- takeScreenshot: "checkpoint_configuration_unavailable - error"
- tapOn:
    text: "OK"

- extendedWaitUntil:
    visible: "Callback: not invoked"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: ".*call #.*"
