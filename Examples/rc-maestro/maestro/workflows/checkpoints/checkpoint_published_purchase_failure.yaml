# The real published checkpoint resolves through RevenueCat and presents its real Test Store paywall. A simulated
# purchase failure must leave the Flow open; closing it afterwards passes the checkpoint once with no entitlements.

appId: com.revenuecat.maestro.ios
name: Published checkpoint purchase failure keeps its Flow open and a later close passes empty
env:
  MAESTRO_STORE: test_store

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_published
      checkpoint_identifier: donottouch_sdk_everyone
      app_user_id: "maestro-checkpoint-${Date.now()}"
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 20000
- tapOn: "Hit checkpoint"

- extendedWaitUntil:
    visible: "Continue"
    timeout: 20000
- takeScreenshot: "checkpoint_published_purchase_failure - paywall"
- tapOn: "Continue"

- extendedWaitUntil:
    visible: "Test failed purchase"
    timeout: 15000
- tapOn: "Test failed purchase"

- extendedWaitUntil:
    visible: "Purchase failure simulated successfully in Test Store."
    timeout: 15000
- takeScreenshot: "checkpoint_published_purchase_failure - error"
- tapOn: "OK"

- assertVisible: "Continue"
- swipe:
    start: "50%,10%"
    end: "50%,90%"
    duration: 600
- extendedWaitUntil:
    visible: "Callback: none (call #1)"
    timeout: 15000
- takeScreenshot: "checkpoint_published_purchase_failure - passed empty"
