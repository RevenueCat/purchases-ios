# The native fixture supplies an invalid checkpoint identifier. Validation fails before resolution, the SDK presents
# its error dialog, and the callback is not invoked.

appId: com.revenuecat.maestro.ios
name: Checkpoint with an invalid identifier shows an error and does not invoke its callback
env:
  MAESTRO_STORE: ${MAESTRO_STORE || 'test_store'}

---
- clearState
- pressKey: home
- launchApp:
    arguments:
      e2e_test_flow: checkpoint_invalid_identifier
- extendedWaitUntil:
    visible: "Hit checkpoint"
    timeout: 15000
- assertVisible: "Callback: not invoked"
- tapOn:
    text: "Hit checkpoint"

- extendedWaitUntil:
    visible: "This content couldn't be loaded. Please try again later."
    timeout: 15000
- takeScreenshot: "checkpoint_invalid_identifier - error"
- tapOn:
    text: "OK"

- extendedWaitUntil:
    visible: "Callback: not invoked"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: ".*call #.*"
